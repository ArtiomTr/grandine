name: Create release

on:
  push:
    branches:
      - develop
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'The reference (branch/tag/commit) to checkout'
        required: false
      tag:
        description: 'Version'
        required: false

jobs:
  build_bin:
    name: Build binary for target ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            rid: linux-x64
            
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            rid: linux-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rid: win-x64
            
          - target: x86_64-apple-darwin
            os: macos-latest
            rid: osx-x64

          - target: aarch64-apple-darwin
            os: macos-latest
            rid: osx-arm64
    steps:
      - name: Disable autocrlf (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: runner.os == 'Linux'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq \
            ca-certificates \
            libssl-dev \
            clang \
            cmake \
            unzip \
            protobuf-compiler \
            libz-dev

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true
          
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--bin grandine --features default-networks --profile=compact --workspace --exclude zkvm_host --exclude zkvm_guest_risc0"

      - name: Rename binary (MacOS / Linux)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/compact/grandine ./grandine-${{ inputs.tag || github.ref_name }}-${{ matrix.rid }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/compact/grandine.exe ./grandine-${{ inputs.tag || github.ref_name }}-${{ matrix.rid }}.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: grandine-${{ matrix.rid }}
          path: |
            ./grandine-${{ inputs.tag || github.ref_name }}-${{ matrix.rid }}
            ./grandine-${{ inputs.tag || github.ref_name }}-${{ matrix.rid }}.exe
          if-no-files-found: error

  build_docker:
    name: Build docker images
    runs-on: ubuntu-latest
    needs: [build_bin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: false

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: grandine-*
          path: artifacts

      - name: Move artifacts
        run: |
          mv ./artifacts/grandine-linux-x64/grandine-${{ inputs.tag || github.ref_name }}-linux-x64 ./artifacts/grandine-linux-x64/grandine
          mv ./artifacts/grandine-linux-arm64/grandine-${{ inputs.tag || github.ref_name }}-linux-arm64 ./artifacts/grandine-linux-arm64/grandine

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log push event
        run: echo "${{ github.event_name }}" "${{ github.event.ref }}"

      - name: Docker meta for amd64
        id: amd64-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            sirsedev/test-repo
          tags: |
            type=semver,pattern=stable-amd64-{{version}}
            type=raw,enable=${{ github.event_name == 'push' && github.event.ref == 'refs/heads/develop' }},value=unstable-amd64

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: ./artifacts/grandine-linux-x64/
          file: ./Dockerfile.cross
          push: true
          provenance: false
          tags: ${{ steps.amd64-meta.outputs.tags }}
          labels: ${{ steps.amd64-meta.outputs.labels }}
          platforms: linux/amd64

      - name: Docker meta for arm64
        id: arm64-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            sirsedev/test-repo
          tags: |
            type=semver,pattern=stable-arm64-{{version}}
            type=raw,enable=${{ github.event_name == 'push' && github.event.ref == 'refs/heads/develop' }},value=unstable-arm64

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: ./artifacts/grandine-linux-arm64/
          file: ./Dockerfile.cross
          push: true
          provenance: false
          tags: ${{ steps.arm64-meta.outputs.tags }}
          labels: ${{ steps.arm64-meta.outputs.labels }}
          platforms: linux/arm64

      - name: Push unstable tag
        if: github.event_name == 'push' && github.event.ref == 'refs/heads/develop'
        run: |
          docker manifest create sirsedev/test-repo:unstable \
            --amend sirsedev/test-repo:unstable-amd64 \
            --amend sirsedev/test-repo:unstable-arm64
          docker manifest push sirsedev/test-repo:unstable

      - name: Push stable tags
        if: github.event_name == 'push' && github.event.ref != 'refs/heads/develop'
        run: |
          docker manifest create sirsedev/test-repo:${{ github.ref_name }} \
            --amend sirsedev/test-repo:stable-amd64-${{ github.ref_name }} \
            --amend sirsedev/test-repo:stable-arm64-${{ github.ref_name }}
          docker manifest create sirsedev/test-repo:stable sirsedev/test-repo:${{ github.ref_name }}
          docker manifest create sirsedev/test-repo:latest sirsedev/test-repo:${{ github.ref_name }}
          docker manifest push sirsedev/test-repo:${{ github.ref_name }}
          docker manifest push sirsedev/test-repo:stable
          docker manifest push sirsedev/test-repo:latest
