name: Create release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'The reference (branch/tag/commit) to checkout'
        required: false
      tag:
        description: 'Version'
        required: false

jobs:
  build_bin:
    name: Build binary for target ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            short-id: amd64
            
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            short-id: arm64
    steps:
      - name: Disable autocrlf (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: runner.os == 'Linux'
          
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true
          
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--bin grandine --features default-networks --profile=compact --workspace --exclude zkvm_host --exclude zkvm_guest_risc0"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: grandine-${{ inputs.tag || github.ref_name }}-${{ matrix.short-id }}
          path: |
            target/${{ matrix.target }}/compact/grandine
          # target/${{ matrix.target }}/compact/grandine.exe # maybe in the future
          if-no-files-found: error
