name: Create release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'The reference (branch/tag/commit) to checkout'
        required: false
      tag:
        description: 'Version'
        required: false

jobs:
  build_bin:
    name: Build binary for target ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            short-id: amd64
            
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            short-id: arm64
    steps:
      - name: Disable autocrlf (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: runner.os == 'Linux'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq \
            llvm

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true
          
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--bin grandine --features default-networks --profile=compact --workspace --exclude zkvm_host --exclude zkvm_guest_risc0"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: grandine-${{ inputs.tag || github.ref_name }}-${{ matrix.short-id }}
          path: |
            target/${{ matrix.target }}/compact/grandine
          # target/${{ matrix.target }}/compact/grandine.exe # maybe in the future
          if-no-files-found: error
  build_csharp_bindings:
    name: Build C# bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build C# bindings
        working-directory: bindings/csharp/Grandine.Bindings
        run: dotnet publish -c Release

      - name: Upload C# bindings dll
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            bindings/csharp/Grandine.Bindings/bin/Release/net9.0/Grandine.Bindings.dll
          if-no-files-found: error
  build_lib:
    name: Build nethermind integration for target ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            rid: linux-x64
            
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            rid: linux-arm64
            
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rid: win-x64
            
          - target: x86_64-apple-darwin
            os: macos-latest
            rid: osx-x64

          - target: aarch64-apple-darwin
            os: macos-latest
            rid: osx-arm64
    steps:
      - name: Disable autocrlf (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: matrix.rid == 'linux-arm64'
          
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true
          
      - name: Build library
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "-p c_grandine --locked --profile=compact"
      
      - name: Upload dynamic libs
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.rid }}
          path: |
            target/${{ matrix.target }}/compact/libgrandine.so
            target/${{ matrix.target }}/compact/libgrandine.dylib
            target/${{ matrix.target }}/compact/grandine.dll
          if-no-files-found: error
  pack_nethermind:
    name: Pack nethermind release with embedded grandine
    runs-on: ubuntu-latest
    needs: [build_csharp_bindings, build_lib]
    strategy:
      matrix:
        include:
          - rid: 'linux-x64'
          - rid: 'linux-arm64'
          - rid: 'osx-x64'
            alias: 'macos-x64'
          - rid: 'osx-arm64'
            alias: 'macos-arm64'
          - rid: 'win-x64'
            alias: 'windows-x64'
    steps:
      - name: Download compiled library
        uses: actions/download-artifact@v4
        with:
          name: lib-${{ matrix.rid }}
          path: grandine
      
      - name: Download plugin
        uses: actions/download-artifact@v4
        with:
          name: plugin
          path: plugin
      
      - name: Get latest nethermind release
        uses: actions/github-script@v8
        id: get-release
        env:
          RID: ${{ matrix.alias || matrix.rid }}
        with:
          script: |
            const rid = process.env.RID;
            const release = await github.rest.repos.getLatestRelease({ owner: 'NethermindEth', repo: 'nethermind' });
            const asset = release.data.assets.find(asset => asset.name.endsWith(rid + '.zip'));
            return asset;
      
      - name: Download nethermind release
        run: wget -O nethermind.zip "${{ fromJson(steps.get-release.outputs.result).browser_download_url }}"

      - name: Unzip nethermind
        run: unzip nethermind.zip -d nethermind

      - name: Put plugin into nethermind
        run: |
          mv ./grandine/* ./nethermind/plugins
          mv ./plugin/* ./nethermind/plugins

      - name: Zip nethermind back
        run: zip -r "grandine-${{ inputs.tag || github.ref_name }}-${{ fromJson(steps.get-release.outputs.result).name }}" ./nethermind/*

      - name: Upload nethermind
        uses: actions/upload-artifact@v4
        with:
          name: grandine-nethermind-${{ matrix.rid }}
          path: grandine-${{ inputs.tag || github.ref_name }}-${{ fromJson(steps.get-release.outputs.result).name }}
          if-no-files-found: error
  publish:
    name: Draft release
    needs: [build_bin, pack_nethermind]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: grandine-*
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
