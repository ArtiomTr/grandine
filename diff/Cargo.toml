[package]
name = 'diff'
edition = { workspace = true }
authors = ["Grandine <info@grandine.io>"]

[lints]
workspace = true

[dependencies]
bitvec = { workspace = true }
ssz = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
try_from_iterator = { workspace = true }
typenum = { workspace = true }
types = { workspace = true }
unsigned-varint = { workspace = true }
zstd = { workspace = true }

## These dependencies are used only by the `comparison` benchmark. Because of
## that, they aren't defined in root workspace - only here directly. They are
## optional so that an ordinary `cargo test --workspace` neither fetches them
## nor needs the C toolchain `xdelta3` builds with; Cargo does not allow
## optional dev-dependencies, hence the regular section.
# This is binary diffing algorithm by galadd, that is purposefully optimized for beacon chain usage.
eth-state-diff = { version = '0.2', optional = true }
# This is binary diffing algorithm, that produced smallest deltas, but slowly.
qbsdiff = { version = '1.4', optional = true }
# `eth-state-diff` deltas are serialized with this.
rkyv = { workspace = true, optional = true }
# This is what lighthouse uses for their deltas.
xdelta3 = { git = "https://github.com/sigp/xdelta3-rs", rev = "fe3906605c87b6c0515bd7c8fc671f47875e3ccc", optional = true }

[features]
comparison = ['dep:eth-state-diff', 'dep:qbsdiff', 'dep:rkyv', 'dep:xdelta3']

[dev-dependencies]
bytesize = { workspace = true }
criterion = { workspace = true }
fs-err = { workspace = true }
reqwest = { workspace = true, features = ['blocking'] }
std_ext = { workspace = true }
tabled = { workspace = true }

# This is the benchmark target, that compares our diffing engine against alternatives
[[bench]]
name = 'comparison'
harness = false
required-features = ['comparison']

[[bench]]
name = 'beacon_state'
harness = false
